[package]
name = "soundcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
soundcraft-ui-egui = { workspace = true }
soundcraft-engine = { workspace = true }
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
android-activity = { version = "0.6", features = ["native-activity"] }
log = { workspace = true }
android_logger = "0.14"
jni = "0.21"

[package.metadata.android]
package = "ai.storyteller.soundcraft"
apk_name = "SoundCraft"
app_name = "SoundCraft"
label = "SoundCraft"
target_sdk_version = 34
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
